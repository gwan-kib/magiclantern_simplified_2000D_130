name: Baseline build

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference-camera:
    name: Build supported reference camera (1100D.105)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ARM build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            python3-docutils \
            make \
            python3 \
            zip

      - name: Show tool versions
        run: |
          arm-none-eabi-gcc --version
          python3 --version
          make --version

      - name: Test EOS 2000D ROM analysis tooling
        run: python3 -m unittest tools.eos2000d.test_rom_manifest

      - name: Test EOS 2000D QEMU scaffolding
        run: python3 -m unittest tools.eos2000d.test_qemu_phase3

      - name: Test EOS 2000D later-phase preparation tooling
        run: python3 -m unittest tools.eos2000d.test_phase4_7_prep

      - name: Enforce EOS 2000D evidence and safety gates
        run: |
          python3 tools/eos2000d/stub_evidence.py \
            --stubs platform/2000D.130/stubs.S \
            --evidence docs/2000D-130/stub-evidence.json
          python3 tools/eos2000d/feature_matrix.py \
            --features platform/2000D.130/features.h \
            --modules platform/2000D.130/modules.included \
            --matrix docs/2000D-130/feature-matrix.json
          python3 tools/eos2000d/port_policy.py --root . --mode pre-rom

      - name: Validate QEMU patcher against supported qemu-eos source
        run: |
          mkdir -p /tmp/qemu-eos/hw/eos
          base="https://raw.githubusercontent.com/reticulatedpines/qemu-eos/qemu-eos-v4.2.1/hw/eos"
          curl --fail --silent --show-error --location "$base/model_list.h" -o /tmp/qemu-eos/hw/eos/model_list.h
          curl --fail --silent --show-error --location "$base/model_list.c" -o /tmp/qemu-eos/hw/eos/model_list.c
          curl --fail --silent --show-error --location "$base/eos.c" -o /tmp/qemu-eos/hw/eos/eos.c
          python3 tools/eos2000d/qemu_eos_patch.py /tmp/qemu-eos
          grep -q 'MODEL_NAME_2000D "2000D"' /tmp/qemu-eos/hw/eos/model_list.h
          grep -q 'firmware_version       = 130' /tmp/qemu-eos/hw/eos/model_list.c
          grep -q 'DEFINE_MACHINE(MODEL_NAME_2000D' /tmp/qemu-eos/hw/eos/eos.c

      - name: Validate 2000D Phase 1 skeleton
        run: |
          test -f platform/2000D.130/Makefile
          test -f platform/2000D.130/internals.h
          test -f platform/2000D.130/consts.h
          test -f platform/2000D.130/stubs.S
          test -f platform/2000D.130/features.h
          test -f platform/2000D.130/gui.h
          make -C platform/2000D.130 preflight

      - name: Verify unvalidated 2000D builds fail safely
        run: |
          set +e
          output="$(make -C platform/2000D.130 2>&1)"
          status=$?
          set -e

          printf '%s\n' "$output"

          if [ "$status" -eq 0 ]; then
            echo "::error::2000D.130 unexpectedly produced a normal build path before firmware constants were verified."
            exit 1
          fi

          if ! grep -q "MAIN_FIRMWARE_ADDR is intentionally unset" <<< "$output"; then
            echo "::error::2000D.130 failed for an unexpected platform-plumbing reason."
            exit 1
          fi

      - name: Build minimal hello-world on supported reference camera
        run: |
          make -C minimal/hello-world clean MODEL=1100D
          make -C minimal/hello-world MODEL=1100D FATAL_WARNINGS=y -j2
          test -s minimal/hello-world/autoexec.bin
          test -s minimal/hello-world/magiclantern.bin

      - name: Clean reference-camera build
        run: make -C platform/1100D.105 clean

      - name: Build reference camera with fatal warnings
        run: make -C platform/1100D.105 FATAL_WARNINGS=y -j2

      - name: Upload reference build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1100D.105-baseline-build
          path: |
            platform/1100D.105/build/
          if-no-files-found: warn
          retention-days: 7
